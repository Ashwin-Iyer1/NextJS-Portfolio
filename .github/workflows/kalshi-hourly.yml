# Hourly Kalshi sync: truncate+reload "kalshi_positions" from live portfolio
# holdings and upsert "kalshi_profile" metrics (runs kalshi_hourly.py).
#
# NOTE: On public repos, GitHub auto-disables scheduled workflows after 60 days
# without repository activity. workflow_dispatch below is the manual escape hatch
# (Actions tab -> this workflow -> "Run workflow") and re-enables the schedule.
#
# Replaces the Heroku Scheduler job for kalshi_hourly.py.
# Secret names use underscores (GitHub secrets cannot contain hyphens);
# kalshi.py prefers KALSHI_ACCESS_KEY / KALSHI_ACCESS_SIGNATURE and falls back
# to the legacy hyphenated names still configured on Heroku.

name: Hourly Kalshi positions sync

on:
  schedule:
    # GH Actions cron is UTC and best-effort (may be delayed).
    # Offset from the other hourly job (:07) so runs don't overlap.
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kalshi-hourly
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run kalshi_hourly.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          KALSHI_ACCESS_KEY: ${{ secrets.KALSHI_ACCESS_KEY }}
          KALSHI_ACCESS_SIGNATURE: ${{ secrets.KALSHI_ACCESS_SIGNATURE }}
        run: python kalshi_hourly.py
